<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Z 兒童英語互動學習圖卡 - Warm Cream Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #FAF8F5; }
        .perspective-1000 { perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 1.5rem; background: white; border: 1px solid #F4F1DE; padding: 2rem; }
        .card-face-back { transform: rotateY(180deg); }
        .flipped { transform: rotateY(180deg); }
    </style>
</head>
<body class="min-h-screen text-[#5C6B73] flex flex-col items-center p-6">
    <header class="w-full max-w-4xl flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold text-[#3D5A80]">A-Z 英語奇幻圖卡</h1>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center gap-8">
        <div class="text-center">
            <h2 id="card-letter-title" class="text-8xl font-black text-[#E07A5F]">Aa</h2>
            <p id="card-index" class="text-[#3D5A80]/60 font-bold">01 / 26</p>
        </div>

        <div class="flex items-center gap-8 w-full">
            <button onclick="prevCard()" class="p-4 rounded-full bg-white shadow-md hover:bg-orange-50 transition">◀</button>
            
            <div class="grid grid-cols-2 gap-8 w-full">
                <!-- 卡片 1 -->
                <div class="h-80 perspective-1000 cursor-pointer" onclick="flipCard('left')">
                    <div id="flashcard-left-inner" class="card-inner">
                        <div class="card-face card-face-front">
                            <span class="text-8xl">🍎</span>
                            <h3 class="text-3xl font-bold mt-4">Apple</h3>
                        </div>
                        <div class="card-face card-face-back">
                            <h3 class="text-3xl font-bold">Apple</h3>
                            <p class="text-xl mt-2 text-[#E07A5F]">蘋果</p>
                        </div>
                    </div>
                </div>
                <!-- 卡片 2 -->
                <div class="h-80 perspective-1000 cursor-pointer" onclick="flipCard('right')">
                    <div id="flashcard-right-inner" class="card-inner">
                        <div class="card-face card-face-front">
                            <span class="text-8xl">🐜</span>
                            <h3 class="text-3xl font-bold mt-4">Ant</h3>
                        </div>
                        <div class="card-face card-face-back">
                            <h3 class="text-3xl font-bold">Ant</h3>
                            <p class="text-xl mt-2 text-[#E07A5F]">螞蟻</p>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="nextCard()" class="p-4 rounded-full bg-white shadow-md hover:bg-orange-50 transition">▶</button>
        </div>
    </main>

    <script>
        let currentIndex = 0;
        const data = [
            { l: "Aa", w1: "Apple", w2: "Ant", e1: "🍎", e2: "🐜", t1: "蘋果", t2: "螞蟻" },
            { l: "Bb", w1: "Bear", w2: "Ball", e1: "🐻", e2: "⚽", t1: "熊", t2: "球" }
        ];

        function updateUI() {
            document.getElementById('card-letter-title').innerText = data[currentIndex].l;
            document.getElementById('card-index').innerText = `${currentIndex + 1} / 26`;
        }

        function nextCard() {
            if (currentIndex < 25) currentIndex++;
            updateUI();
        }

        function prevCard() {
            if (currentIndex > 0) currentIndex--;
            updateUI();
        }

        function flipCard(side) {
            const inner = document.getElementById(`flashcard-${side}-inner`);
            inner.classList.toggle('flipped');
        }

        function switchTab(tab) { console.log("Tab:", tab); }
    </script>
</body>
</html>
